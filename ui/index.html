<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Onecarat · Agent Office CX</title><link rel="stylesheet" href="/style.css"></head>
<body><header><a class="brand" href="/">◈ <span>ONECARAT <small>AGENT OFFICE CX</small></span></a><div id="connection" role="status">接続待ち</div><button id="connect">接続</button><button id="disconnect">切断</button></header>
<main><aside><div class="eyebrow">YOUR WORKSPACE</div><h1>Office</h1><p class="muted">仕事の動きと、次の判断。</p><button id="new" class="primary">＋ 新しいセッション</button><button id="refresh">一覧を照合</button><nav id="sessions" aria-label="セッション"></nav><footer>PHASE 01 · LOCAL ONLY<br>Research Lab / 秘書は後続フェーズ</footer></aside>
<section class="workspace"><div class="section-heading"><div><div class="eyebrow">LIVE OFFICE</div><h2 id="title">今日の仕事を、ここから。</h2></div><span id="mode" class="badge">接続待ち</span></div>
<p id="error" class="error" role="alert" hidden></p><button id="retry-state" hidden>画面を再確認</button>
<div class="office"><div class="window"><i></i><i></i></div><div class="wall-label">ONECARAT OFFICE</div><div id="agents" class="agents"><p class="empty">セッションを選ぶと、観測したエージェントが表示されます。</p></div><div class="plant">♧</div><div class="floor"></div></div>
<div class="below"><section class="conversation"><div class="section-heading"><h2>会話と成果</h2><button id="read">状態を照合</button></div><p id="session-note" class="muted">新規セッションで仕事を始められます。</p><div id="messages" aria-live="polite"></div><form id="composer"><label for="prompt">依頼・追加指示</label><textarea id="prompt" rows="3" maxlength="12000" placeholder="何を手伝いましょうか？"></textarea><div class="compose-bottom"><span id="input-note" class="muted"></span><button id="send" class="primary" type="submit">依頼を送る ↗</button></div></form></section>
<section class="activity"><h2>判断が必要なこと</h2><div id="approvals"></div><h2>活動の記録</h2><ol id="events"></ol></section></div></section></main><script type="module" src="/app.mjs"></script></body></html>
